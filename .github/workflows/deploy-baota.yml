name: Deploy To Baota

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lingxing-sync-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call Baota WebHook
        env:
          BAOTA_WEBHOOK_URL: ${{ secrets.BAOTA_WEBHOOK_URL }}
        run: |
          payload="$(printf '{\"ref\":\"refs/heads/main\",\"after\":\"%s\",\"repository\":{\"full_name\":\"%s\"},\"head_commit\":{\"id\":\"%s\"}}' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA")"
          response="$(curl --tls-max 1.2 -kfsS --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 60 \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data "$payload" \
            "$BAOTA_WEBHOOK_URL")"
          jq -e '.code == 1' <<<"$response" >/dev/null

      - name: Verify deployed commit and public health
        run: |
          deployed=""
          for attempt in $(seq 1 120); do
            response="$(curl -fsS --max-time 10 https://sync.usfan.net/api/settings || true)"
            deployed="$(jq -r '.data.deploy_commit // empty' <<<"$response" 2>/dev/null || true)"
            db_connected="$(jq -r '.data.db_connected // false' <<<"$response" 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ] && [ "$db_connected" = "true" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not reach commit $GITHUB_SHA (current: ${deployed:-unknown})" >&2
          exit 1
