# 领星同步机 — 配置文件示例（进 git）
# 完整字段说明见 doc/03-config.md
# 真实运行请 cp config.example.yaml config.yaml 后改密码与凭证

# ===== 服务配置 =====
server:
  port: 7799                     # UI/API 端口，宝塔 Nginx 反代到这里；宪法固定 7799
  secret: "change_this_key"

# ===== 数据库 =====
database:
  host: "127.0.0.1"
  port: 3306
  user: "lingsync_rw"
  password: "your_password"
  db: "lingsync"
  max_open: 20
  max_idle: 5
  conn_timeout_sec: 10

# ===== 领星账号（可多个，按 app_key 分组）=====
# quota_group 默认等于 id；同公司多 app_key 设相同值共享限流桶
accounts:
  - id: "sc_us"
    name: "自营-美国"
    quota_group: "sc_us"
    app_key: "your_app_key"
    app_secret: "your_app_secret"
    connection_check:
      cron: "*/20 * * * *"       # 真实获取 OpenAPI Token 并主动续租
      enabled: true

# ===== 接口同步任务 =====
# rate 字段从领星官方接口文档 Rate Limit 区块原样抄写，不猜测
#
# 参数形态（三选一或组合，喂给领星的业务参数）：
#   window_days: N        >0 时注入 start_date/end_date（近 N 天范围，报表/订单类常用）
#   date_field: "xxx"     非空时注入「单个日期」参数（如销量统计的 event_date）
#   date_offset_days: N   配合 date_field：0=今天，1=昨天（报表通常取昨天，T+1 才齐）
#   extra_params: {...}   固定业务参数（如 type: 1）
# 重试为 worker 层固定策略（网络/429/5xx 指数退避，最多 3 次），无需在此配置。
endpoints:
  # 店铺来源接口：启动时优先同步，结果落 ls_stores 供 iterate_by_store 接口读取
  - name: sc_stores
    display: "SC 店铺列表"
    account: "sc_us"
    path: "/erp/sc/data/seller/lists"   # 领星 API Path（签名 GET 例外路径）
    method: "GET"
    table: "ls_stores"
    record_id_fields: ["sid"]
    is_store_source: true               # 宪法 §10：启动优先同步
    rate:
      bucket: 5
      interval_ms: 200
      multi_interval_ms: 0
      dimension: "account+path"
    cron: "0 */6 * * *"
    enabled: true
    window_days: 0

  - name: sc_inventory
    display: "SC FBA 库存"
    account: "sc_us"
    # 早期误写 "/openapi/erp/sc/inventory/list"（不存在）。
    # 本路径与 006 迁移建的 ls_fba_inventory 同源，生产已跑通（单次 5079 行）。
    path: "/erp/sc/routing/fba/fbaStock/fbaList"
    method: "GET"
    table: "ls_fba_inventory"
    # 同一 fnsku 在多店铺各一行，唯一键必须带 sid。
    record_id_fields: ["sid", "fnsku"]
    rate:
      bucket: 1                         # bucket=1 → 强制串行翻页
      interval_ms: 1000
      multi_interval_ms: 10000
      dimension: "account+path"
    cron: "0 */2 * * *"
    enabled: true
    window_days: 0                      # 0 = 全量
    # 按店铺迭代：Worker 从 ls_stores 取该账号店铺，逐个注入 store_param_name 各拉一次。
    iterate_by_store: true
    store_param_name: "sid"
    # store_type 限定只迭代该类型店铺（SC/VC，对齐 ls_stores.store_type）；空=不过滤。
    # SC 接口喂 VC 店铺 sid（或反之）会拉到错数据，故 SC 迭代接口必须填 "SC"。
    store_type: "SC"

  - name: sc_listing
    display: "SC Listing"
    account: "sc_us"
    path: "/erp/sc/data/mws/listing"
    method: "POST"
    table: "ls_sc_listing"
    record_id_fields: ["sid", "seller_sku"]
    rate:
      bucket: 1
      interval_ms: 1000
      multi_interval_ms: 1000
      dimension: "account+path"
    cron: "0 */6 * * *"
    enabled: true
    window_days: 0
    iterate_by_store: true
    store_param_name: "sid"
    store_type: "SC"

  - name: sc_products
    display: "SC 产品列表"
    account: "sc_us"
    path: "/erp/sc/routing/data/local_inventory/productList"
    method: "POST"
    table: "ls_sc_products"
    record_id_fields: ["sku"]
    rate:
      bucket: 1
      interval_ms: 1000
      multi_interval_ms: 0
      dimension: "account+path"
    cron: "0 */6 * * *"
    enabled: true
    window_days: 0

  # 「SC 广告日报」示例已删除，不是遗漏。原来那段的
  #   path: "/openapi/erp/sc/ads/daily"   record_id_fields: ["report_id"]
  # 两者都不存在于领星 OpenAPI（凭空写的），照抄就是 404。同 internal/config/catalog.go
  # 已移除该模板的理由：本文件的示例必须是「路径和唯一键都验证过」的。
  #
  # 领星真实的广告报表不是一个「日报」接口，而是一族（doc/core/08-api-reference.md §6.5）：
  #   POST /pb/openapi/newad/spProductAdReports      SP 商品报表
  #   POST /pb/openapi/newad/listHsaProductAdReport  SB 商品报表
  #   POST /pb/openapi/newad/sdProductAdReports      SD 商品报表
  # 还要先用 POST /basicOpen/baseData/account/list 取 profile_id 作参数。
  # 要接按 doc/core/07-add-endpoint.md 走：probe 摸字段 → 各建一张表 → 各加一段配置。

# ===== 日志留存 =====
retention:
  task_logs_days: 90
  tasks_days: 365
  cleanup_cron: "0 3 * * *"
